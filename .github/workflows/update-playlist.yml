name: Update IPTV playlist

on:
  workflow_dispatch:
  schedule:
    # UTC 03:17; avoid the top-of-hour congestion common to scheduled workflows.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: iptv-playlist-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_REGION: auto
      PLAYLIST_DEPLOY_KEY: ${{ secrets.PLAYLIST_DEPLOY_KEY }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pipenv

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv sync --dev

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Run local preflight tests
        run: pipenv run python -m pytest -q

      - name: Update playlist and build public output
        run: |
          pipenv run python main.py
          pipenv run python -c "from cloud.publication import build_public_playlists; build_public_playlists('.')"

      - name: Publish public playlists
        # The verified files are built before R2 upload. Publish them even when
        # a later, independent R2 request has a transient failure.
        if: ${{ always() && hashFiles('public_output/live.m3u') != '' && hashFiles('public_output/full.m3u') != '' }}
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PLAYLIST_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone --depth 1 git@github.com:SimonTGR/IPTV_Playlist.git public-repository
          cp public_output/live.m3u public-repository/live.m3u
          cp public_output/full.m3u public-repository/full.m3u
          cp public_output/status.json public-repository/status.json
          if [ -f public_output/epg.xml.gz ]; then
            cp public_output/epg.xml.gz public-repository/epg.xml.gz
          fi
          cd public-repository
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.m3u full.m3u status.json
          if [ -f epg.xml.gz ]; then
            git add epg.xml.gz
          fi
          if git diff --cached --quiet; then
            echo "public_playlist_changed=false"
          else
            git commit -m "Update IPTV playlists"
            git push origin HEAD:main
            echo "public_playlist_changed=true"
          fi

      - name: Keep sanitized execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-update-report
          if-no-files-found: ignore
          retention-days: 7
          path: |
            output/report.json
            output/source_report.candidate.json
            output/worker_sync_report.json
